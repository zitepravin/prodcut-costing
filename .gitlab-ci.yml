# Product Costing Software — GitLab CI
# Mirrors GitHub Actions CI stages for multi-platform teams

stages:
  - build
  - test
  - package

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  FF_USE_FASTZIP: "true"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .m2/repository
    - frontend/node_modules

backend:compile:
  stage: build
  image: maven:3.9.9-eclipse-temurin-21
  script:
    - cd backend && mvn -B -DskipTests compile
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

backend:test:
  stage: test
  image: maven:3.9.9-eclipse-temurin-21
  script:
    - cd backend && mvn -B test
  artifacts:
    when: always
    paths:
      - backend/target/surefire-reports/
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

frontend:test:
  stage: test
  image: node:22-bookworm
  script:
    - cd frontend
    - if [ -f package-lock.json ]; then npm ci; else npm install; fi
    - npm run typecheck
    - npm run test
    - npm run build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

docker:backend:
  stage: package
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker build -t product-costing-backend:$CI_COMMIT_SHORT_SHA ./backend
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"
      when: on_success
    - when: manual
      allow_failure: true
