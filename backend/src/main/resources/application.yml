spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s

  profiles:
    default: local

  application:
    name: product-costing-backend

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB

  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/product_costing?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USERNAME:costing_app}
    password: ${DB_PASSWORD:changeme1}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # PRODUCTION SIZING — do not blindly raise:
      # effective_pool ≈ (MySQL max_connections - reserve) / max_backend_instances
      pool-name: pcs-hikari
      maximum-pool-size: ${HIKARI_MAX_POOL:20}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT_MS:30000}
      idle-timeout: ${HIKARI_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${HIKARI_MAX_LIFETIME_MS:1800000}
      leak-detection-threshold: ${HIKARI_LEAK_DETECTION_MS:60000}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        format_sql: false
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    clean-disabled: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
      write-bigdecimal-as-plain: true

  # SMTP — used when app.notification.email-enabled=true
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}
            required: ${SMTP_STARTTLS_REQUIRED:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
        debug: ${SMTP_DEBUG:false}

server:
  port: ${SERVER_PORT:8088}
  error:
    include-message: always
    include-binding-errors: always

app:
  billing:
    default-gateway: ${PAYMENT_PROVIDER:STUB}
    razorpay:
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
      base-url: ${RAZORPAY_BASE_URL:https://api.razorpay.com/v1}

  license:
    # Override via LICENSE_SIGNING_SECRET env; never commit real secrets
    signing-secret: ${LICENSE_SIGNING_SECRET:}

  tenant:
    seed-catalog-on-create: ${TENANT_SEED_CATALOG_ON_CREATE:true}
    seed-from-default-customer-code: DEFAULT

  jwt:
    secret: ${JWT_SECRET:CHANGE_ME_IN_PRODUCTION_MIN_256_BIT_SECRET_VALUE_0001}
    access-token-expiration-ms: ${JWT_ACCESS_EXP_MS:900000}
    refresh-token-expiration-ms: ${JWT_REFRESH_EXP_MS:604800000}
    issuer: product-costing-software

  security:
    cors-allowed-origins: ${CORS_ORIGINS:*}
    require-strong-jwt-secret: ${REQUIRE_STRONG_JWT_SECRET:true}
    swagger-public: ${SWAGGER_PUBLIC:false}
    login-rate-limit-max-attempts: ${LOGIN_RATE_LIMIT_MAX:20}
    login-rate-limit-window-seconds: ${LOGIN_RATE_LIMIT_WINDOW_SEC:300}
    rate-limit-store: ${RATE_LIMIT_STORE:memory}
    api-rate-limit-enabled: ${API_RATE_LIMIT_ENABLED:true}
    api-rate-limit-max: ${API_RATE_LIMIT_MAX:600}
    api-rate-limit-window-seconds: ${API_RATE_LIMIT_WINDOW_SEC:60}
    upload-rate-limit-max: ${UPLOAD_RATE_LIMIT_MAX:30}

    oidc:
      enabled: ${OIDC_ENABLED:false}
      issuer-uri: ${OIDC_ISSUER_URI:}
      client-id: ${OIDC_CLIENT_ID:}
      client-secret: ${OIDC_CLIENT_SECRET:}

  notification:
    email-enabled: ${NOTIFICATION_EMAIL_ENABLED:false}
    mail-from: ${NOTIFICATION_MAIL_FROM:noreply@product-costing.local}
    mail-from-name: ${NOTIFICATION_MAIL_FROM_NAME:Product Costing}

  storage:
    provider: ${STORAGE_PROVIDER:local}
    local-root: ${STORAGE_LOCAL_ROOT:./data/object-storage}
    s3:
      bucket: ${STORAGE_S3_BUCKET:product-costing-files}
      region: ${STORAGE_S3_REGION:us-east-1}
      endpoint: ${STORAGE_S3_ENDPOINT:}

  outbox:
    worker-enabled: ${OUTBOX_WORKER_ENABLED:true}
    publisher: ${OUTBOX_PUBLISHER:logging}
    poll-ms: ${OUTBOX_POLL_MS:5000}
    batch-size: ${OUTBOX_BATCH_SIZE:20}

  costing:
    # System base currency for master rates and calculated component costs
    # that do not yet carry an explicit currency_code.
    base-currency: ${COSTING_BASE_CURRENCY:USD}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.automotive.costing: DEBUG
    org.hibernate.SQL: WARN
  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId:-}]"

# Vendor Selection — evidence expiry scheduler (V52)
vendor-selection:
  evidence-expiry:
    scheduler-enabled: true
    cron: "0 30 2 * * *"

  decision-webhook:
    enabled: ${VS_DECISION_WEBHOOK_ENABLED:false}
    url: ${VS_DECISION_WEBHOOK_URL:}
    timeout-ms: ${VS_DECISION_WEBHOOK_TIMEOUT_MS:5000}
    poll-interval-ms: ${VS_DECISION_WEBHOOK_POLL_MS:60000}

  capability-expiry:
    scheduler-enabled: true
    cron: "0 45 2 * * *"

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: ${ACTUATOR_EXPOSE:health,info,metrics,prometheus}

  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

  health:
    db:
      enabled: true
    mail:
      enabled: false

  metrics:
    tags:
      application: ${spring.application.name}

  observations:
    key-values:
      application: ${spring.application.name}

# Customer Helping AI Agent
helping-agent:
  llm:
    enabled: false
    endpoint: ${HELPING_AGENT_LLM_ENDPOINT:}
    api-key: ${HELPING_AGENT_LLM_API_KEY:}